<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hanime1 源码有用行提取</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #d9e0ea;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --code: #0f172a;
      --code-bg: #eef2f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      font-size: 14px;
    }

    main {
      width: min(1180px, calc(100vw - 40px));
      margin: 28px auto;
      display: grid;
      gap: 14px;
    }

    h1 {
      font-size: 22px;
      line-height: 1.2;
      margin: 0;
      font-weight: 750;
    }

    .sub {
      color: var(--muted);
      line-height: 1.6;
      margin: -4px 0 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);
      overflow: hidden;
    }

    .bar {
      min-height: 46px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .title {
      font-weight: 700;
      white-space: nowrap;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    textarea {
      width: 100%;
      min-height: 640px;
      padding: 12px;
      border: 0;
      outline: none;
      resize: vertical;
      background: #fff;
      color: var(--code);
      font: 12px/1.55 Consolas, "Cascadia Mono", monospace;
    }

    pre {
      min-height: 640px;
      max-height: 760px;
      overflow: auto;
      margin: 0;
      padding: 12px;
      background: var(--code-bg);
      color: var(--code);
      font: 12px/1.55 Consolas, "Cascadia Mono", monospace;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .queue-box {
      background: #fff;
    }

    button {
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 0 12px;
      font: inherit;
      cursor: pointer;
    }

    button:hover { border-color: #b9c6d8; }

    .primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .primary:hover {
      border-color: var(--primary-dark);
      background: var(--primary-dark);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toast {
      color: var(--primary);
      font-size: 12px;
      min-width: 70px;
    }

    .rules {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      user-select: none;
    }

    input[type="checkbox"] {
      width: 14px;
      height: 14px;
      margin: 0;
    }

    @media (max-width: 900px) {
      main { width: calc(100vw - 24px); margin: 18px auto; }
      .grid { grid-template-columns: 1fr; }
      textarea, pre { min-height: 420px; }
      .bar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>hanime1 源码有用行提取</h1>
      <div class="sub">粘贴网页 Ctrl+U 源码，自动输出最适合建档提取的原始 HTML 行：标题、日期、制作商、keywords tag；同类重复时只保留最优一行。</div>
    </div>

    <div class="panel">
      <div class="bar">
        <div class="title">提取范围</div>
        <div class="rules">
          <label><input type="checkbox" data-rule="title" checked>标题</label>
          <label><input type="checkbox" data-rule="date" checked>日期</label>
          <label><input type="checkbox" data-rule="studio" checked>制作商</label>
          <label><input type="checkbox" data-rule="tag" checked>tag</label>
        </div>
      </div>
    </div>

    <div class="grid">
      <section class="panel">
        <div class="bar">
          <div>
            <div class="title">输入源码</div>
            <div class="meta" id="inputMeta">0 行</div>
          </div>
          <div class="actions">
            <button id="sampleBtn">用当前目录样本</button>
            <button id="clearBtn">清空</button>
          </div>
        </div>
        <textarea id="source" spellcheck="false" placeholder="把 Ctrl+U 页面源码粘贴到这里"></textarea>
      </section>

      <section class="panel">
        <div class="bar">
          <div>
            <div class="title">有用原始行</div>
            <div class="meta" id="outputMeta">0 行</div>
          </div>
          <div class="actions">
            <button class="primary" id="queueBtn">加入队列</button>
            <span class="toast" id="toast"></span>
          </div>
        </div>
        <pre id="output"></pre>
      </section>

      <section class="panel">
        <div class="bar">
          <div>
            <div class="title">集数队列</div>
            <div class="meta" id="queueMeta">0 话</div>
          </div>
          <div class="actions">
            <button class="primary" id="copyQueueBtn">一键复制</button>
            <button id="clearQueueBtn">清空队列</button>
            <span class="toast" id="queueToast"></span>
          </div>
        </div>
        <pre class="queue-box" id="queueOutput"></pre>
      </section>
    </div>
  </main>

  <script>
    const sourceEl = document.getElementById('source');
    const outputEl = document.getElementById('output');
    const queueOutputEl = document.getElementById('queueOutput');
    const inputMetaEl = document.getElementById('inputMeta');
    const outputMetaEl = document.getElementById('outputMeta');
    const queueMetaEl = document.getElementById('queueMeta');
    const toastEl = document.getElementById('toast');
    const queueToastEl = document.getElementById('queueToast');
    const queueItems = [];

    const rulePatterns = {
      title: [
        /id="shareBtn-title"/i,
        /meta\s+property="og:title"/i,
        /meta\s+name="title"/i,
      ],
      date: [
        /video-details-wrapper[\s\S]*?(观看次数：|觀看次數：)[\s\S]*?\d{4}-\d{2}-\d{2}/,
        /(观看次数：|觀看次數：)[\s\S]*?\d{4}-\d{2}-\d{2}/,
        /\d{4}-\d{2}-\d{2}/,
      ],
      studio: [
        /id="video-artist-name"/i,
      ],
      tag: [
        /meta\s+name="keywords"/i,
      ],
    };

    function activeRules() {
      return Array.from(document.querySelectorAll('input[data-rule]:checked')).map((el) => el.dataset.rule);
    }

    function pickLines(text) {
      const lines = text.split(/\r?\n/);
      const rules = activeRules();
      const picked = [];

      rules.forEach((rule) => {
        const patterns = rulePatterns[rule];
        for (const pattern of patterns) {
          const found = findFirstLine(lines, pattern, rule);
          if (found) {
            picked.push(found);
            return;
          }
        }
      });

      return picked;
    }

    function findFirstLine(lines, pattern, rule) {
      for (let index = 0; index < lines.length; index += 1) {
        const trimmed = lines[index].trim();
        if (!trimmed) continue;
        if (!pattern.test(trimmed)) continue;
        if (rule === 'date' && !/(观看次数：|觀看次數：)/.test(trimmed)) continue;
        return trimmed;
      }
      return '';
    }

    function refresh() {
      const text = sourceEl.value;
      const inputLines = text ? text.split(/\r?\n/).length : 0;
      const picked = pickLines(text);
      inputMetaEl.textContent = `${inputLines} 行`;
      outputMetaEl.textContent = `${picked.length} 行`;
      outputEl.textContent = picked.join('\n');
      toastEl.textContent = '';
    }

    function cnEpisodeNumber(num) {
      const digits = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
      if (num <= 10) return num === 10 ? '十' : digits[num];
      if (num < 20) return `十${digits[num - 10]}`;
      const tens = Math.floor(num / 10);
      const ones = num % 10;
      return `${digits[tens]}十${digits[ones] || ''}`;
    }

    function refreshQueue() {
      queueOutputEl.textContent = queueItems.join('\n\n');
      queueMetaEl.textContent = `${queueItems.length} 话`;
      queueToastEl.textContent = '';
    }

    function addToQueue() {
      const text = outputEl.textContent.trim();
      if (!text) {
        toastEl.textContent = '没有内容';
        return;
      }
      const episodeLabel = `第${cnEpisodeNumber(queueItems.length + 1)}话：`;
      queueItems.push(`${episodeLabel}\n${text}`);
      sourceEl.value = '';
      outputEl.textContent = '';
      inputMetaEl.textContent = '0 行';
      outputMetaEl.textContent = '0 行';
      toastEl.textContent = '已加入';
      refreshQueue();
      window.setTimeout(() => { toastEl.textContent = ''; }, 1600);
    }

    async function copyText(text, toastTarget) {
      if (!text) {
        toastTarget.textContent = '没有内容';
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        toastTarget.textContent = '已复制';
      } catch (error) {
        const range = document.createRange();
        range.selectNodeContents(queueOutputEl);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        document.execCommand('copy');
        selection.removeAllRanges();
        toastTarget.textContent = '已复制';
      }
      window.setTimeout(() => { toastTarget.textContent = ''; }, 1600);
    }

    async function copyQueue() {
      await copyText(queueOutputEl.textContent, queueToastEl);
    }

    function clearQueue() {
      queueItems.length = 0;
      refreshQueue();
    }

    function loadSample() {
      sourceEl.value = [
        '<h3 id="shareBtn-title" class="video-details-wrapper" style="font-weight: bold; margin-top: 10px; color: white;">姉SUMMER！ 上巻 バ、バカァァッン [中文字幕]</h3>',
        '<div class="video-details-wrapper hidden-sm hidden-md hidden-lg hidden-xl" style="font-size: 12px; color: #aaa; font-weight: normal; margin-top: -5px; margin-bottom: 17px">观看次数：308.1万次&nbsp;&nbsp;2011-12-30</div>',
        '<a id="video-artist-name" style="color: white; text-decoration: none;" href="https://hanime1.me/search?query=メリー・ジェーン&amp;genre=裏番">',
        '<meta name="keywords" content="姐, 內射, 巨乳, 御姐, 浴室, 純愛, 腳交, 著衣, 處女, 近親, 陰毛, 顏射, 女王樣, 中文字幕" />',
      ].join('\n');
      refresh();
    }

    sourceEl.addEventListener('input', refresh);
    document.querySelectorAll('input[data-rule]').forEach((el) => el.addEventListener('change', refresh));
    document.getElementById('queueBtn').addEventListener('click', addToQueue);
    document.getElementById('copyQueueBtn').addEventListener('click', copyQueue);
    document.getElementById('clearQueueBtn').addEventListener('click', clearQueue);
    document.getElementById('clearBtn').addEventListener('click', () => {
      sourceEl.value = '';
      refresh();
    });
    document.getElementById('sampleBtn').addEventListener('click', loadSample);

    refresh();
    refreshQueue();
  </script>
</body>
</html>
